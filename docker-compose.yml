services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["6379:6379"]

  nats:
    image: nats:2
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/varz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports: ["4222:4222", "8222:8222"]

  platform-init:
    build:
      context: ./platform
      dockerfile: infrastructure/docker/node-service.Dockerfile
    command: ["sh","-lc","npx prisma db push --schema prisma/schema.prisma && npm run db:seed"]
    environment: &env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/platform
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: dev-secret
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway: &svc
    build:
      context: ./platform
      dockerfile: infrastructure/docker/node-service.Dockerfile
    command: ["npm","run","dev","-w","api-gateway"]
    environment: *env
    depends_on:
      platform-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports: ["3000:3000"]

  identity-service:
    <<: *svc
    command: ["npm","run","dev","-w","identity-service"]
    environment: { <<: *env, PORT: 3001 }

  user-service:
    <<: *svc
    command: ["npm","run","dev","-w","user-service"]
    environment: { <<: *env, PORT: 3002 }

  authorization-service:
    <<: *svc
    command: ["npm","run","dev","-w","authorization-service"]
    environment: { <<: *env, PORT: 3003 }

  workflow-service:
    <<: *svc
    command: ["npm","run","dev","-w","workflow-service"]
    environment: { <<: *env, PORT: 3004 }

  approval-service:
    <<: *svc
    command: ["npm","run","dev","-w","approval-service"]
    environment: { <<: *env, PORT: 3005 }

  automation-service:
    <<: *svc
    command: ["npm","run","dev","-w","automation-service"]
    environment: { <<: *env, PORT: 3006 }

  notification-service:
    <<: *svc
    command: ["npm","run","dev","-w","notification-service"]
    environment: { <<: *env, PORT: 3007 }

  dashboard-service:
    <<: *svc
    command: ["npm","run","dev","-w","dashboard-service"]
    environment: { <<: *env, PORT: 3008 }

  audit-service:
    <<: *svc
    command: ["npm","run","dev","-w","audit-service"]
    environment: { <<: *env, PORT: 3009 }

  integration-service:
    <<: *svc
    command: ["npm","run","dev","-w","integration-service"]
    environment: { <<: *env, PORT: 3010 }

  worker-service:
    <<: *svc
    command: ["npm","run","dev","-w","worker-service"]
    environment: { <<: *env, PORT: 3011 }

  web:
    <<: *svc
    command: ["npm","run","dev","-w","web"]
    environment: { <<: *env, PORT: 5173 }
    ports: ["5173:5173"]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api-gateway:
        condition: service_started
      web:
        condition: service_started
    ports: ["8080:80"]
    volumes:
      - ./platform/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus
    volumes:
      - ./platform/infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana
    ports: ["3001:3000"]

  loki:
    image: grafana/loki:2.9.3
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["3100:3100"]

  tempo:
    image: grafana/tempo:2.3.1
    ports: ["3200:3200"]
