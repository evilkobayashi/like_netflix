apiVersion: batch/v1
kind: Job
metadata:
  name: platform-init
  namespace: enterprise-platform
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: platform-init
          image: ghcr.io/example/enterprise-platform:latest
          command: ["sh", "-lc", "npx prisma db push --schema prisma/schema.prisma && npm run db:seed"]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: enterprise-platform }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
            - { name: POSTGRES_DB, value: platform }
          ports: [{ containerPort: 5432 }]
---
