events {}
http {
  server {
    listen 80;

    location /api/ {
      proxy_pass http://api-gateway:3000/;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://web:5173/;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
    }
  }
}
